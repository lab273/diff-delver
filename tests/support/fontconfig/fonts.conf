<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The font configuration the journey browser runs with (playwright.config.ts).
  It knows one font, the bundled Inter, which the journeys' global setup unpacks
  from the app's own WOFF into a TrueType file (tests/support/journey-fonts.ts):
  Chromium on Linux needs fontconfig to give it one font it can open as a plain
  file, or its web fonts fail to load at random. No system font is ever used, not
  even as a fallback, and text drawn in this fallback copy fails the journey step,
  because the page must use the web fonts. This file also fixes how glyphs are
  rasterised, so the host's font settings (hinting, subpixel order, LCD filter)
  cannot change a screenshot. Paths are relative to this file.
-->
<fontconfig>
	<dir prefix="relative">../../../node_modules/.cache/diff-delver-journey-fonts</dir>
	<cachedir prefix="relative">../../../node_modules/.cache/diff-delver-journey-fonts/cache</cachedir>
	<alias binding="same"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
	<alias binding="same"><family>serif</family><prefer><family>Inter</family></prefer></alias>
	<alias binding="same"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
	<alias binding="same"><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
	<match target="pattern">
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
		<edit name="hinting" mode="assign"><bool>false</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
		<edit name="autohint" mode="assign"><bool>false</bool></edit>
		<edit name="rgba" mode="assign"><const>none</const></edit>
		<edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
		<edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
	</match>
	<match target="font">
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
		<edit name="hinting" mode="assign"><bool>false</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
		<edit name="autohint" mode="assign"><bool>false</bool></edit>
		<edit name="rgba" mode="assign"><const>none</const></edit>
		<edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
		<edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
	</match>
</fontconfig>
