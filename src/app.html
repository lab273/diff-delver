<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<!-- Keeps keys pressed before the page's scripts have run (src/lib/ui/early-input.ts),
		     written in by src/hooks.server.ts. -->
		<script nonce="%sveltekit.nonce%">
			%diff-delver.early-keys%
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
