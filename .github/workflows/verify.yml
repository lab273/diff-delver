# Runs `pnpm verify` on every commit that reaches main, not only the newest one,
# so a commit that fails on its own is found even when a later one repairs it.
# See README, "How we work".
name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# bash with -e and pipefail, so a failing command in a pipeline fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: verify-${{ github.event.after || github.sha }}
  cancel-in-progress: false

jobs:
  commits:
    name: List the pushed commits
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.list.outputs.batches }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: list
        name: List commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          BRANCH: ${{ github.ref_name }}
          REMOTE: origin
          # GitHub's limit on jobs in one matrix. More commits share jobs.
          MAX_JOBS: 256
        # Which commits, and why, is described in the script; its tests are next to it.
        # The script writes the step output itself, only once the listing has
        # succeeded, so a failure fails this step.
        run: scripts/ci-commits.sh

  verify:
    name: Verify ${{ matrix.batch.name }}
    needs: commits
    runs-on: ubuntu-latest
    # Per commit in the batch, worked out by the script, since GitHub's
    # expressions have no arithmetic. Most batches hold one commit.
    timeout-minutes: ${{ matrix.batch.timeout }}
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.commits.outputs.batches) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.batch.first }}
          # A batch of several commits checks each of them out in turn, so it
          # needs the history (0); one commit needs only itself (1).
          fetch-depth: ${{ matrix.batch.depth }}

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Find the Playwright version
        id: playwright
        # Assigned first, so a failure fails the step instead of giving an empty version.
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Each commit on its own, in order. A failure does not stop the rest of the
      # batch, so every failing commit is named. Node and pnpm are the versions the
      # batch's first commit asks for; the dependencies are each commit's own.
      - name: Verify each commit
        env:
          COMMITS: ${{ matrix.batch.commits }}
        run: |
          failed=""
          for commit in $COMMITS; do
            echo "::group::Verify $commit"
            git checkout --quiet --detach "$commit"
            if pnpm install --frozen-lockfile && pnpm exec playwright install chromium && pnpm verify; then
              echo "$commit passed"
            else
              echo "::error::$commit failed pnpm verify"
              failed="$failed $commit"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi

      - name: Keep the journey traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journeys-${{ matrix.batch.first }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
