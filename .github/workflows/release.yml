# Makes a release of diff delver on GitHub: the only way one is made (README,
# "How we work" and "Releasing"). It runs only when a person starts it by hand,
# from main, and runs every test (pnpm verify) on the commit before packing it.
# Packing waits for the tests to pass, releasing waits for the packed package to
# be installed and run, and only the last job may write to the repository.
# Nothing here touches npm: diff delver is not published there.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release: three whole numbers with no v, such as 0.2.0, after the newest release.'
        required: true
        type: string
      commit:
        description: "The commit you mean to release: at least the first 7 characters of its id, from main's history. The release stops if main has moved on."
        required: true
        type: string

permissions: {}

# bash with -e and pipefail, so a failing command in a pipeline fails its step.
defaults:
  run:
    shell: bash

# One release at a time; a second waits rather than racing the first for a version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check what was asked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # With read permission only, GitHub lists no drafts here; the releasing
      # job, which may write, sees them.
      - name: List the tags and releases there are
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS_FILE: ${{ runner.temp }}/tags.txt
          RELEASES_FILE: ${{ runner.temp }}/releases.txt
        run: scripts/release-names.sh

      # The checks and their messages are in the script; its tests are next to it.
      - id: check
        name: Check the version and the commit
        env:
          STAGE: before-tests
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          TAGS_FILE: ${{ runner.temp }}/tags.txt
          RELEASES_FILE: ${{ runner.temp }}/releases.txt
        run: node scripts/release-preflight.ts

  verify:
    name: Run every test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm verify

      - name: Keep the journey traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journeys-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Pack and try the package
    # Only after every test passed on this commit.
    needs: [check, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same commit and lockfile as the tests ran, built with the version
      # written in, so diff-delver --version says it.
      - name: Build the release
        env:
          DIFF_DELVER_RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: pnpm build

      - name: Pack it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: pnpm release:package --version "$VERSION" --out release

      # Installs it with npx from a local address, with only Node and git, opens
      # a diff and stops it. If this fails, nothing is released.
      - name: Try the packed package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: pnpm release:check release/diff-delver.tgz --version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release it on GitHub
    needs: [check, verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      # For the checks' scripts. The token that may write is not kept in the
      # checkout: listing the tags of this public repository needs none.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Check the package is the one that was tried
        working-directory: release
        run: sha256sum -c diff-delver.tgz.sha256

      # Every first check again, from the same script, just before releasing:
      # this job can be re-run on its own ("Re-run failed jobs") long after the
      # first check, so the version must still be after the newest release and
      # tag, and its name free. With write permission, drafts are listed too.
      - name: List the tags and releases there are now
        env:
          TAGS_FILE: ${{ runner.temp }}/tags.txt
          RELEASES_FILE: ${{ runner.temp }}/releases.txt
        run: scripts/release-names.sh

      - name: Check the version and the commit again
        env:
          STAGE: before-release
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          REF: ${{ github.ref }}
          TAGS_FILE: ${{ runner.temp }}/tags.txt
          RELEASES_FILE: ${{ runner.temp }}/releases.txt
        run: node scripts/release-preflight.ts

      # Latest, explicitly: the check just above found this version after every
      # release and tag, and the concurrency group lets no other run release
      # meanwhile, so it is the newest. Saying so does not rely on a default.
      - id: create
        name: Create the release
        run: |
          gh release create "$TAG" \
            --target "$COMMIT" \
            --title "diff delver $VERSION" \
            --notes-file release/release-notes.md \
            --latest \
            release/diff-delver.tgz release/diff-delver.tgz.sha256

      - name: Check what was released
        run: |
          mkdir "$RUNNER_TEMP/released"
          gh release download "$TAG" --dir "$RUNNER_TEMP/released"
          cd "$RUNNER_TEMP/released"
          sha256sum -c diff-delver.tgz.sha256
          echo "Released diff delver $VERSION: https://github.com/$GH_REPO/releases/tag/$TAG"

      # Only when creating the release began and this job then failed: a
      # release or its tag may exist, and starting again is refused while it does.
      - name: Say what to do with what was made
        if: failure() && steps.create.outcome != 'skipped'
        run: |
          echo "::error title=The release may be incomplete::Creating the release $TAG began, then this job failed, so the release or its tag may already exist. Open https://github.com/$GH_REPO/releases/tag/$TAG. If the release is whole, with its notes and both files, diff-delver.tgz and diff-delver.tgz.sha256, keep it. If not, delete the release and the tag $TAG on GitHub, then start the release again."
